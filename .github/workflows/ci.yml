name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Prepare pinned ShareX sources
        shell: pwsh
        run: ./eng/sync-sharex.ps1

      - name: Restore
        run: dotnet restore ScreenshotAssistant.slnx

      - name: Build
        run: dotnet build ScreenshotAssistant.slnx -c Release --no-restore

      - name: Test
        run: dotnet test ScreenshotAssistant.slnx -c Release --no-build
